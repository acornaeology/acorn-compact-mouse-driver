[project]
name = "acorn-compact-mouse-driver"
version = "0.1.0"
description = "Annotated disassembly of PMFS, the Acorn Master Compact pointer and mouse driver ROM"
license = "MIT"
authors = [
    { name = "Robert Smallshire" },
]
requires-python = ">=3.12"
dependencies = [
    "fantasm>=1.4.0",
    "dasmos>=4.6.0",
    "oaknut-disc>=0",
]

[dependency-groups]
dev = [
    "pre-commit>=3.0",
]

[tool.uv]
index-url = "https://pypi.org/simple"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# This repo is annotated-disassembly content, not a published library.
only-include = ["versions"]
